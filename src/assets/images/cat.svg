<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left ear -->
  <path d="M50 60 L30 20 L60 50 Z" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Right ear -->
  <path d="M150 60 L170 20 L140 50 Z" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="45" fill="#FFA07A" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Left eye -->
  <ellipse cx="85" cy="75" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="87" cy="72" rx="3" ry="5" fill="white"/>

  <!-- Right eye -->
  <ellipse cx="115" cy="75" rx="8" ry="12" fill="#2C3E50"/>
  <ellipse cx="117" cy="72" rx="3" ry="5" fill="white"/>

  <!-- Nose -->
  <path d="M100 85 L95 90 L100 92 L105 90 Z" fill="#FF6B6B"/>

  <!-- Mouth -->
  <path d="M100 92 Q95 97 90 95" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 92 Q105 97 110 95" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="60" y1="80" x2="30" y2="75" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="85" x2="30" y2="85" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="30" y2="95" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="140" y1="80" x2="170" y2="75" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="85" x2="170" y2="85" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="90" x2="170" y2="95" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="145" rx="40" ry="50" fill="#FFA07A" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Left arm -->
  <ellipse cx="65" cy="135" rx="12" ry="30" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2" transform="rotate(-20 65 135)"/>

  <!-- Right arm -->
  <ellipse cx="135" cy="135" rx="12" ry="30" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2" transform="rotate(20 135 135)"/>

  <!-- Left leg -->
  <ellipse cx="85" cy="180" rx="10" ry="20" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Right leg -->
  <ellipse cx="115" cy="180" rx="10" ry="20" fill="#FF9A8B" stroke="#FF6B6B" stroke-width="2"/>

  <!-- Tail -->
  <path d="M140 160 Q170 150 180 170 Q185 180 175 185" stroke="#FF6B6B" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Belly spot -->
  <ellipse cx="100" cy="155" rx="15" ry="20" fill="#FFB6A3" opacity="0.6"/>
</svg>
